<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スケジュール管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase SDK -->

  <style>
    body {
      font-family: sans-serif;
      padding: 15px;
      background: #f5f5f5;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
    }
    .card {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h2>予定入力</h2>

<input id="title" placeholder="イベントタイトル">
<input id="date" type="date">
<select id="type">
  <option value="通常便">通常便</option>
  <option value="チャーター">チャーター</option>
</select>

<button onclick="addEvent()">追加</button>

<h2>スケジュール</h2>
<div id="schedule"></div>

<script type="module">
  // 🔥 自分のFirebase configに差し替え
  const firebaseConfig = {
  apiKey: "AIzaSyDk6OIV4haOS8oqfwZud7Ag-awealisGq0",
  authDomain: "schedule-app-60aeb.firebaseapp.com",
  projectId: "schedule-app-60aeb",
  storageBucket: "schedule-app-60aeb.firebasestorage.app",
  messagingSenderId: "830239994512",
  appId: "1:830239994512:web:8addc482c306083af0de15"
};

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  window.addEvent = addEvent;

  async function addEvent() {
    const title = document.getElementById("title").value;
    const date = document.getElementById("date").value;
    const type = document.getElementById("type").value;

    if (!title || !date) {
      alert("入力してください");
      return;
    }

    await addDoc(collection(db, "events"), {
      title,
      date,
      type
    });

    loadEvents();
  }

  async function loadEvents() {
    const querySnapshot = await getDocs(collection(db, "events"));

    let events = [];

    querySnapshot.forEach(doc => {
      events.push(doc.data());
    });

    render(events);
  }

  function render(events) {
    const grouped = {};

    events.forEach(e => {
      if (!grouped[e.date]) grouped[e.date] = [];
      grouped[e.date].push(e);
    });

    const container = document.getElementById("schedule");
    container.innerHTML = "";

    Object.keys(grouped).sort().forEach(date => {
      const div = document.createElement("div");
      div.className = "card";

      let html = `<strong>📅 ${date}</strong><br>`;

      grouped[date].forEach(e => {
        html += `・${e.title}（${e.type}）<br>`;
      });

      div.innerHTML = html;
      container.appendChild(div);
    });
  }

  loadEvents();
</script>

</body>
</html>
